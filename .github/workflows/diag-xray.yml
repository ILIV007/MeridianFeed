name: diag-xray

# TEMPORARY diagnostic (Plan Rev.2 R2): why does the Xray loopback
# control fail probe204 on runners while passing everywhere locally?
# Stages isolate: controls alone / with real direct_ip / manual curl
# through the tunnel / http-inbound+freedom only / exception repr.
# Delete this workflow when the A/B decision is recorded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Xray-core
        env:
          XRAY_VERSION: "26.11.9"
          XRAY_SHA256: "b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82"
        run: |
          curl -sL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  /tmp/xray.zip" | sha256sum -c -
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null
          unzip -o -q /tmp/xray.zip -d /tmp/xray-bin
          sudo install -m 0755 /tmp/xray-bin/xray /usr/local/bin/xray
          xray version

      - name: Staged diagnosis
        run: |
          python3 - <<'PYEOF'
          import sys, subprocess, time, json
          sys.path.insert(0, "pipeline")
          import verifier

          XR = "/usr/local/bin/xray"

          print("== stage 1: run_xray_controls(xray, None)")
          r = verifier.run_xray_controls(XR, None)
          print("   ok:", r["ok"], "| positive:", r["positive"])

          print("== stage 2: run_xray_controls(xray, real direct_ip)")
          dip, _ = verifier.direct_egress()
          print("   direct_ip:", dip)
          r = verifier.run_xray_controls(XR, dip)
          print("   ok:", r["ok"], "| positive:", r["positive"])

          print("== stage 3: manual pair, exception repr + curl")
          import uuid as uuidlib
          token = str(uuidlib.uuid4())
          origin, base = verifier._start_origin()
          sport = verifier.free_port()
          server_cfg = {"log": {"loglevel": "warning"},
                        "inbounds": [{"protocol": "vless", "listen": "127.0.0.1",
                                      "port": sport,
                                      "settings": {"clients": [{"id": token}],
                                                   "decryption": "none"}}],
                        "outbounds": [{"protocol": "freedom", "tag": "direct"}]}
          with open("/tmp/diag_server.json", "w") as fh:
              json.dump(server_cfg, fh)
          server = subprocess.Popen([XR, "run", "-c", "/tmp/diag_server.json"],
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              print("   server port ready:", verifier._wait_port(sport))
              client = {"protocol": "vless", "tag": "proxy",
                        "settings": {"vnext": [{"address": "127.0.0.1", "port": sport,
                                                "users": [{"id": token, "encryption": "none"}]}]}}
              cport = verifier.free_port()
              client_cfg = {"log": {"loglevel": "warning"},
                            "inbounds": [{"protocol": "http", "tag": "in",
                                          "listen": "127.0.0.1", "port": cport}],
                            "outbounds": [client]}
              with open("/tmp/diag_client.json", "w") as fh:
                  json.dump(client_cfg, fh)
              proc = subprocess.Popen([XR, "run", "-c", "/tmp/diag_client.json"],
                                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  print("   client port ready:", verifier._wait_port(cport))
                  opener = verifier._proxy_opener(cport)
                  try:
                      status, body, ms = verifier._fetch(opener, base + "/generate_204")
                      print("   urllib fetch:", status, round(ms, 1), "ms")
                  except Exception as e:
                      print("   urllib fetch EXC:", type(e).__name__, repr(e)[:300])
                  rc = subprocess.run(["curl", "-sS", "-o", "/dev/null", "-w", "%{http_code}",
                                       "--proxy", "http://127.0.0.1:%d" % cport,
                                       base + "/generate_204"],
                                      capture_output=True, text=True, timeout=20)
                  print("   curl fetch:", rc.stdout, rc.stderr.strip()[:200])
              finally:
                  proc.terminate()
          finally:
              server.terminate()
              origin.shutdown()
          PYEOF
