name: diag-xray

# TEMPORARY diagnostic #3 (Plan Rev.2 R2): Xray vless loopback pair
# hangs on runners — TCP established everywhere, server never dials
# the origin, no bytes queued. Xray logs go to STDOUT (earlier stderr
# captures were empty for that reason). Stages: debug-log pair /
# cross-implementation pairs / older Xray version. Delete when done.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned sing-box + Xray v26.11.9 + Xray v25.12.8
        env:
          SING_BOX_VERSION: "1.11.15"
          SING_BOX_SHA256: "950af37eb2d7e55dddae34a18411cd617303fd99d2dc75bc76b6dd9fcd97d9c5"
          XRAY_VERSION: "26.11.9"
          XRAY_SHA256: "b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82"
        run: |
          curl -sL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          echo "${SING_BOX_SHA256}  /tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          curl -sL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  /tmp/xray.zip" | sha256sum -c -
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null
          unzip -o -q /tmp/xray.zip -d /tmp/xray-bin
          sudo install -m 0755 /tmp/xray-bin/xray /usr/local/bin/xray
          xray version | head -1
          curl -sL -o /tmp/xray25.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip"
          curl -sL -o /tmp/xray25.dgst \
            "https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip.dgst"
          python3 - <<'PYEOF'
          import hashlib, re
          h = hashlib.sha256(open("/tmp/xray25.zip", "rb").read()).hexdigest()
          dgst = open("/tmp/xray25.dgst").read()
          m = re.search(r"([0-9a-f]{64})", dgst)
          print("xray25 sha256 match:", m and m.group(1) == h)
          PYEOF
          unzip -o -q /tmp/xray25.zip -d /tmp/xray25-bin
          /tmp/xray25-bin/xray version | head -1

      - name: Staged diagnosis 3
        run: |
          python3 - <<'PYEOF'
          import sys, subprocess, time, json
          sys.path.insert(0, "pipeline")
          import verifier
          import uuid as uuidlib

          XR = "/usr/local/bin/xray"
          XR25 = "/tmp/xray25-bin/xray"
          SB = "/usr/local/bin/sing-box"
          origin, base = verifier._start_origin()
          print("origin at", base)

          def curl_through(cport, tag, wait=12):
              rc = subprocess.run(
                  ["curl", "-sS", "-m", str(wait), "-o", "/dev/null",
                   "-w", "%{http_code}", "--proxy",
                   "http://127.0.0.1:%d" % cport, base + "/generate_204"],
                  capture_output=True, text=True, timeout=wait + 10)
              print("   [%s] curl: %r %s" % (tag, rc.stdout, rc.stderr.strip()[:120]))
              return rc.stdout == "204"

          def xray_server(token, sport, binary, tag):
              cfg = {"log": {"loglevel": "debug"},
                     "inbounds": [{"protocol": "vless", "listen": "127.0.0.1",
                                   "port": sport,
                                   "settings": {"clients": [{"id": token}],
                                                "decryption": "none"}}],
                     "outbounds": [{"protocol": "freedom", "tag": "direct"}]}
              path = "/tmp/d3_server_%s.json" % tag
              with open(path, "w") as fh:
                  json.dump(cfg, fh)
              out = open("/tmp/d3_server_%s.log" % tag, "wb")
              p = subprocess.Popen([binary, "run", "-c", path],
                                   stdout=out, stderr=subprocess.STDOUT)
              out.close()
              print("   [%s] server ready: %s" % (tag, verifier._wait_port(sport)))
              return p

          def xray_client(token, sport, binary, tag):
              cport = verifier.free_port()
              cfg = {"log": {"loglevel": "debug"},
                     "inbounds": [{"protocol": "http", "tag": "in",
                                   "listen": "127.0.0.1", "port": cport}],
                     "outbounds": [{"protocol": "vless", "tag": "proxy",
                                    "settings": {"vnext": [
                                        {"address": "127.0.0.1", "port": sport,
                                         "users": [{"id": token,
                                                    "encryption": "none"}]}]}}]}
              path = "/tmp/d3_client_%s.json" % tag
              with open(path, "w") as fh:
                  json.dump(cfg, fh)
              out = open("/tmp/d3_client_%s.log" % tag, "wb")
              p = subprocess.Popen([binary, "run", "-c", path],
                                   stdout=out, stderr=subprocess.STDOUT)
              out.close()
              print("   [%s] client ready: %s" % (tag, verifier._wait_port(cport)))
              return p, cport

          print("== stage 1: xray26 pair with stdout debug logs")
          token = str(uuidlib.uuid4())
          sport = verifier.free_port()
          srv = xray_server(token, sport, XR, "s1")
          cli, cport = xray_client(token, sport, XR, "s1")
          try:
              curl_through(cport, "s1")
          finally:
              cli.terminate(); srv.terminate()
          time.sleep(0.5)
          for tag in ("server_s1", "client_s1"):
              try:
                  data = open("/tmp/d3_%s.log" % tag, "rb").read().decode(
                      "utf-8", "replace")
                  print("--- %s log (%d chars) ---" % (tag, len(data)))
                  print(data[-2200:])
              except Exception as e:
                  print("--- %s unreadable: %s" % (tag, e))

          print("== stage 2: xray25 pair")
          token = str(uuidlib.uuid4())
          sport = verifier.free_port()
          srv = xray_server(token, sport, XR25, "s2")
          cli, cport = xray_client(token, sport, XR25, "s2")
          try:
              curl_through(cport, "s2")
          finally:
              cli.terminate(); srv.terminate()

          print("== stage 3: sing-box client -> xray26 server")
          token = str(uuidlib.uuid4())
          sport = verifier.free_port()
          srv = xray_server(token, sport, XR, "s3")
          try:
              client_ob = {"type": "vless", "tag": "proxy", "server": "127.0.0.1",
                           "server_port": sport, "uuid": token}
              res = verifier.run_tunnel(client_ob, SB, None,
                                        urls=(base + "/generate_204",
                                              base + "/trace",
                                              base + "/__down"))
              print("   [s3] sing-box tunnel:", res["pass"], res["reason"])
          finally:
              srv.terminate()
          origin.shutdown()
          PYEOF
